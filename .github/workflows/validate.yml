name: validate

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate JSON files
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path(".").rglob("*.json"):
              try:
                  json.loads(p.read_text())
              except Exception as e:
                  bad.append((str(p), str(e)))
          if bad:
              for p, e in bad:
                  print(f"INVALID {p}: {e}")
              sys.exit(1)
          print("all JSON valid")
          PY
      - name: crew CLI smoke test
        run: |
          python3 bin/crew init --name ci-smoke --role worker --caps "ci"
          python3 bin/crew tasks-list
          python3 bin/crew jobs-list

  # Contact wire: everyone hears about green/red builds without asking.
  notify:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: notify contact wire
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'lightship' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT: ${{ needs.validate.result }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="lightship CI ${RESULT} on ${REF} @ ${SHA:0:7} — ${REPO} — ${RUN}"
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -d "$MSG" "https://ntfy.sh/${NTFY_TOPIC}"
            echo "→ ntfy"
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=${MSG}"
            echo "→ telegram"
          fi
          if [ -z "$NTFY_TOPIC" ] && [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "no wire configured — set repo secret NTFY_TOPIC or TELEGRAM_*"
          fi
